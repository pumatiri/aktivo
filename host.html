<!DOCTYPE html>
<html lang="en" data-page="host">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="robots" content="noindex">
  <title>AKTIVO — Dashboard</title>
  <meta name="description" content="Create, present and review your AKTIVO sessions.">
  <meta name="theme-color" content="#0e9f8e">
  <meta property="og:title" content="AKTIVO — Dashboard">
  <meta property="og:description" content="Create, present and review your AKTIVO sessions.">
  <link rel="icon" type="image/png" href="assets/img/logo.png">
  <link rel="apple-touch-icon" href="assets/img/logo.png">
  <script src="assets/js/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/css/aktivo.css">
  <link rel="stylesheet" href="assets/css/host.css">
</head>
<body>
  <!-- Login gate -->
  <div id="gate" class="center-screen" hidden>
    <div class="card gate-card">
      <div class="row" style="justify-content:space-between;margin-bottom:22px">
        <span class="brand"><img id="logo-gate" alt=""><span>AKTIVO</span></span>
        <span id="theme-gate"></span>
      </div>
      <h2 style="font-size:24px;margin-bottom:4px">Host dashboard</h2>
      <p class="muted small" style="margin-bottom:20px">Log in to manage your sessions.</p>
      <div id="gate-auth"></div>
      <div class="center" style="margin-top:16px"><a class="small" id="gate-home" href="#">&larr; Back to the home page</a></div>
    </div>
  </div>

  <!-- App -->
  <div id="app" hidden>
    <header class="topbar">
      <div class="container topbar-inner">
        <button class="brand" type="button" id="brand-home"><img id="logo-top" alt=""><span>AKTIVO</span><span class="brand-sub">Dashboard</span></button>
        <div class="grow"></div>
        <span id="theme-top"></span>
        <button class="user-btn" type="button" id="user-btn"><span class="avatar" id="avatar"></span><span class="uname ellipsis" id="uname" style="max-width:160px"></span></button>
      </div>
    </header>

    <main class="container dash-main">
      <!-- Sessions list -->
      <section id="view-list">
        <div class="list-head">
          <div>
            <h1 id="hello"></h1>
            <p class="muted">Create, present and review your interactive sessions.</p>
          </div>
          <div class="row wrap">
            <button class="btn btn-ghost" type="button" id="btn-import" hidden></button>
            <button class="btn btn-primary btn-lg" type="button" id="btn-new"></button>
          </div>
        </div>
        <div class="stat-row" id="list-stats"></div>
        <div class="list-tools">
          <div class="search" id="search-wrap"><input class="input" id="search" placeholder="Search sessions…" autocomplete="off"></div>
          <div class="seg" id="filter-seg">
            <button class="seg-btn active" type="button" data-f="all">All</button>
            <button class="seg-btn" type="button" data-f="active">Open</button>
            <button class="seg-btn" type="button" data-f="closed">Closed</button>
          </div>
        </div>
        <div class="session-grid" id="session-grid"></div>
      </section>

      <!-- Session editor -->
      <section id="view-editor" hidden>
        <div class="ed-head">
          <button class="icon-btn lg" type="button" id="btn-back" title="All sessions" aria-label="All sessions"></button>
          <div class="ed-title">
            <h1 id="ed-name"></h1>
            <div class="ed-sub" id="ed-sub"></div>
          </div>
          <div class="ed-actions" id="ed-actions"></div>
        </div>
        <div class="tabs ed-tabs" id="ed-tabs">
          <button class="tab active" type="button" data-tab="slides"></button>
          <button class="tab" type="button" data-tab="participants"></button>
          <button class="tab" type="button" data-tab="settings"></button>
          <button class="tab" type="button" data-tab="report"></button>
        </div>

        <div id="tab-slides" class="ed-grid">
          <aside class="card slide-list-card">
            <button class="btn btn-primary btn-block" type="button" id="btn-add-slide"></button>
            <div class="slide-list" id="slide-list"></div>
          </aside>
          <div class="card slide-form-card" id="slide-form"></div>
        </div>
        <div id="tab-participants" hidden></div>
        <div id="tab-settings" hidden></div>
        <div id="tab-report" hidden></div>
      </section>
    </main>
  </div>

  <div class="ak-toasts" id="ak-toasts" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/qr.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/host.js"></script>
</body>
</html>
